name: LifeMag IA — implantar IA protegida no Cloudflare
# Alternativa opcional: a integração GitHub->Cloudflare já pode publicar automaticamente.
# Este fluxo só é necessário caso a integração direta não funcione.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  implantar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Obter projeto isolado LifeMag IA
        uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exigir configuração e segurança antes da implantação
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Configuração ausente em GitHub Actions Secrets: $key"
              exit 1
            fi
          done
      - name: Preparar arquivos estáticos usados nos testes de integração
        run: node scripts/build-worker.mjs
      - name: Verificar código e testes
        run: |
          node --check worker/index.js
          node --check worker/science-index.js
          node --check worker/science-do.js
          node --check worker/anvisa-catalog.js
          node --check worker/anvisa-live.js
          node --check worker/anvisa-auto-sync.js
          node --check worker/ingestion-coordinator.js
          node --check worker/anvisa-discover.js
          node --check testes/testar_descoberta_anvisa.js
          node --check testes/testar_auto_sync.js
          node --check testes/testar_anvisa_online.js
          node --check worker/anvisa-importer.js
          node --check testes/testar_importacao_anvisa.js
          node --check testes/testar_sqlite_real.mjs
          node --check worker/clinical-draft.js
          node --check worker/consensus.js
          node --check testes/testar_formula.js
          node --check testes/testar_consensus.js
          node --check testes/testar_diagnostico.js
          node --check scripts/preparar-indice-cientifico.mjs
          node --check testes/testar_preparo_d1.js
          node --check testes/testar_fontes.js
          node testes/testar_logica.js
          node testes/testar_interface.js
          node testes/testar_clinica.js
          node --no-warnings --experimental-loader ./testes/cloudflare-runtime-loader.mjs testes/testar_ia.js
          node testes/testar_fontes.js
          node testes/testar_importacao_anvisa.js
          node testes/testar_anvisa_online.js
          node testes/testar_auto_sync.js
          node testes/testar_descoberta_anvisa.js
          node testes/testar_formula.js
          node testes/testar_consensus.js
          node --no-warnings --experimental-loader ./testes/cloudflare-runtime-loader.mjs testes/testar_diagnostico.js
          node --no-warnings --experimental-loader ./testes/cloudflare-runtime-loader.mjs testes/testar_sqlite_real.mjs
          node testes/testar_preparo_d1.js
      - name: Preparar assets com a Home aprovada
        run: node scripts/build-worker.mjs
      - name: Enviar Worker e assets à conta Cloudflare
        run: npx --yes wrangler@4 deploy
      - name: Observação de segurança
        run: |
          echo "O Worker usa ctx.access da plataforma. A política Cloudflare Access restringe o e-mail autorizado."
          echo "Confirme Access > Protect this Worker > All traffic e teste autorização antes de uso clínico."
