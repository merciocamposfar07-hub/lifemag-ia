name: LifeMag IA — publicar protótipo no GitHub Pages

# Publicar automaticamente quando o código aprovado mudar em main.
# Executar manualmente também é possível no menu Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos do protótipo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe e comportamento do protótipo
        run: |
          node --check src/store.js
          node --check src/app.js
          node --check testes/testar_logica.js
          node --check testes/testar_interface.js
          node --check testes/testar_clinica.js
          node --check worker/index.js
          node --check worker/science-index.js
          node --check worker/clinical-draft.js
          node --check worker/consensus.js
          node --check testes/testar_formula.js
          node --check testes/testar_consensus.js
          node --check testes/testar_diagnostico.js
          node --check scripts/preparar-indice-cientifico.mjs
          node --check testes/testar_preparo_d1.js
          node --check testes/testar_fontes.js
          node --check testes/testar_ia.js
          node testes/testar_logica.js
          node testes/testar_interface.js
          node testes/testar_clinica.js
          node scripts/build-worker.mjs
          node testes/testar_ia.js
          node testes/testar_fontes.js
          node testes/testar_formula.js
          node testes/testar_consensus.js
          node testes/testar_diagnostico.js
          node testes/testar_preparo_d1.js
      - name: Preparar somente arquivos públicos do site
        run: |
          mkdir -p public/src public/assets
          cp index.html public/
          cp src/app.js src/store.js src/style.css public/src/
          cp assets/icone-oficial-escuro.png public/assets/
          touch public/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
