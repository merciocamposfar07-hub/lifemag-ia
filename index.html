const STORAGE_KEY = 'lifemag-prototype-v0.1.0';
const initialState = () => ({
  schema: 1,
  patients: [],
  visits: [],
  settings: {
    professional: 'Dr. Mércio Campos', role: 'Farmacêutico Clínico', crf: 'CRF-PE 07880',
    workplace: 'Farmácia Barata do Trabalhador', address: 'Av. São José, 44 — Centro — Chã Grande/PE',
    businessPhone: '', cnpj: '', professionalAddress: '', contact: '',
  },
});
function readStore() {
  try {
    const value = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return value && value.schema === 1 && Array.isArray(value.patients) && Array.isArray(value.visits)
      ? { ...initialState(), ...value, settings: { ...initialState().settings, ...value.settings } }
      : initialState();
  } catch (_) { return initialState(); }
}
function writeStore(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function uid(prefix='id') {
  if (globalThis.crypto?.randomUUID) return `${prefix}_${crypto.randomUUID()}`;
  return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2)}`;
}
function yyyyMmDd(date = new Date()) {
  const y = date.getFullYear(), m=String(date.getMonth()+1).padStart(2,'0'), d=String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function addDays(iso, delta) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso||'')) return '';
  const [y,m,d]=iso.split('-').map(Number);
  const date=new Date(y,m-1,d,12,0,0);
  if (Number.isNaN(date.getTime())) return '';
  date.setDate(date.getDate()+delta);
  return yyyyMmDd(date);
}
const endDate = (visit) => addDays(visit.startDate || visit.date, Math.max(1,Number(visit.duration)||1)-1);
const alertDate = (visit) => addDays(endDate(visit), -3);
function daysUntil(iso, now=yyyyMmDd()) {
  if (!iso) return Infinity;
  const asUTC = s => Date.UTC(...s.split('-').map((n,i)=>i===1?Number(n)-1:Number(n)));
  return Math.round((asUTC(iso)-asUTC(now))/86400000);
}
const fmtDate = iso => iso && /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso.split('-').reverse().join('/') : '—';

function field(name,label,val='',required=false,type='text'){return `<div class="field"><label for="${name}">${label}${required?' *':''}</label><input id="${name}" name="${name}" type="${type}" ${type==='number'?'step="any"':''} value="${E(val)}" ${required?'required':''}></div>`;}

<div class="panel"><h3>Atendimento atual</h3><div class="info-columns"><div class="stat"><b>${v.ingredients.length}</b><span>Substâncias</span></div><div class="stat"><b>${Number(v.duration)||'—'}</b><span>Dias</span></div><div class="stat"><b>${(v.revisions||[]).length}</b><span>Versões</span></div></div><div class="accent-band" style="margin-top:16px"><strong>Motor / Coadjuvante</strong><p class="muted small" style="margin:7px 0 0">A função clínica, alvo sintomático e evidências ficarão aqui e no editor — nunca no PDF da receita.</p></div><div class="notice">Nenhuma formulação terapêutica será inventada neste protótipo. Sugestões automatizadas dependerão de fontes, validação de interações e revisão profissional.</div><div class="btnrow"><button class="btn primary" data-page="editor">${I('plus')} Criar formulação</button><button class="btn" data-page="science">${I('science')} Fontes</button></div></div></div>`;}
function editor(){const v=visit();if(!v)return pageHeader('Studio Magistral','Editor de formulação com revisão profissional.')+pickVisit();const p=patientFor(v);return pageHeader('Studio Magistral',`${E(p?.name||'—')} · ${fmtDate(v.date)}`,`<button class="btn subtle" data-page="conversation">${I('sparkles')} Voltar à conversa</button>`)+`<div class="top-panels" style="grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr)"><div class="panel"><h3>Composição magistral</h3><form id="formula-form"><div class="form-grid">${field('formulaName','Nome da formulação',v.formulaName||'')}${field('presentation','Forma farmacêutica',v.presentation||'')}${field('quantity','Quantidade para manipular',v.quantity||'')}${field('route','Via de administração',v.route||'')}${field('posology','Posologia',v.posology||'')} ${field('schedules','Horários',v.schedules||'')}${field('meals','Relação com refeições',v.meals||'')}${field('duration','Duração do tratamento (dias)',v.duration||15,false,'number')}${field('date','Data do atendimento',v.date||yyyyMmDd(),false,'date')}${field('startDate','Data efetiva de início',v.startDate||v.date,false,'date')}<div class="field full"><label>Orientações adicionais (aparecem na receita)</label><textarea name="observations">${E(v.observations||'')}</textarea></div></div><hr class="divider"/><div class="panel-title"><h3>Substâncias e concentração</h3><button type="button" class="btn compact" data-action="add-ingredient">${I('plus')} Adicionar</button></div><div class="ingredients">${v.ingredients.length?v.ingredients.map(ingredientRow).join(''):empty('Fórmula vazia','Adicione ingredientes para começar.','science')}</div><div class="form-actions"><button type="submit" class="btn primary">${I('check')} Salvar formulação</button></div></form></div>

function ingredientRow(ing){return `<div class="ingredient-row" data-ingredient-id="${ing.id}"><div class="ingredient-header"><span class="badge ${ing.role==='MOTOR'?'ok':'neutral'}">${E(ing.role||'A definir')}</span><button type="button" class="btn compact danger" data-remove-ingredient="${ing.id}" title="Remover substância">${I('trash')}</button></div><div class="two-col-row"><div class="field"><label>Substância</label><input data-ing-field="name" value="${E(ing.name||'')}" placeholder="Nome"></div><div class="field"><label>Dose</label><input data-ing-field="dose" value="${E(ing.dose||'')}" placeholder="Ex.: 200"></div><div class="field"><label>Unidade</label><select data-ing-field="unit">${['mg','mcg','g','UI','%','mL'].map(x=>`<option ${ing.unit===x?'selected':''}>${x}</option>`).join('')}</select></div><div></div></div><details class="ingredient-details"><summary>Análise exclusiva do farmacêutico</summary><div class="field" style="margin-top:10px"><label>Classificação da função</label><select data-ing-field="role"><option value="">Selecionar</option><option ${ing.role==='MOTOR'?'selected':''}>MOTOR</option><option ${ing.role==='COADJUVANTE'?'selected':''}>COADJUVANTE</option></select></div><div class="field"><label>Sintomas/alvos clínicos e justificativa</label><textarea data-ing-field="target">${E(ing.target||'')}</textarea></div><div class="field"><label>Fonte, força de evidência e alertas</label><textarea data-ing-field="evidence">${E(ing.evidence||'')}</textarea></div></details></div>`;}

function diffVersions(v){const old=v.revisions.at(-2),newer=v.revisions.at(-1);if(!old||!newer)return '';const fmt=i=>`${E(i.name||'—')} ${E(i.dose||'')} ${E(i.unit||'')}`;const ia=old.ingredients||[],ib=newer.ingredients||[];let a=new Map(ia.map(x=>[x.id,x])),b=new Map(ib.map(x=>[x.id,x]));let diffs=[];for(const [id,item] of b){if(!a.has(id))diffs.push(`Adicionada: ${fmt(item)}`);else if(JSON.stringify([item.name,item.dose,item.unit])!==JSON.stringify([a.get(id).name,a.get(id).dose,a.get(id).unit]))diffs.push(`Alterada: ${fmt(a.get(id))} → ${fmt(item)}`);}for(const [id,item]of a){if(!b.has(id))diffs.push(`Removida: ${fmt(item)}`);}return `<div class="row-between"><h3>Últimas versões</h3><span class="badge">${v.revisions.length} revisões</span></div><p class="muted small">${fmtDate(old.savedAt?.slice(0,10))} → ${fmtDate(newer.savedAt?.slice(0,10))}</p>${diffs.length?diffs.map(d=>`<div class="source">${d}</div>`).join(''):'<p class="muted">Não houve mudança de substâncias e doses entre estas versões.</p>'}<div class="notice">Comparações de eficácia, interações e benefício incremental ainda exigem o motor científico a ser implementado.</div>`;}
const sources=[['PubMed / NCBI','Pesquisa clínica, doses, mecanismos, segurança e estudos','https://pubmed.ncbi.nlm.nih.gov/','Farmacologia'],['Anvisa','Farmacopeia Brasileira, Formulário Nacional e normas','https://www.gov.br/anvisa/pt-br','Farmacologia'],['Conitec / PCDT','Protocolos clínicos e diretrizes','https://www.gov.br/conitec/pt-br','Farmacologia'],['OMS / WHO','Diretrizes de atividade física e saúde','https://www.who.int/','Atividade física'],['ACSM','Treinamento resistido, força e condicionamento','https://acsm.org/','Atividade física'],['Guia de Atividade Física do Brasil','Ministério da Saúde — recomendações nacionais','https://www.gov.br/saude/pt-br','Atividade física'],['Guia Alimentar do Brasil','Ministério da Saúde — educação alimentar','https://www.gov.br/saude/pt-br','Alimentação']];
function science(){return pageHeader('Central de Atualização Científica','Referências curadas e integrações planejadas para o LifeMag IA.')+`<div class="notice blue">Fontes cadastradas, mas monitoramento automático e consulta em tempo real ainda NÃO estão conectados. Nenhuma atualização científica é afirmada como já verificada.</div><div class="info-columns"><div class="stat"><b>3</b><span>Farmacologia</span></div><div class="stat"><b>3</b><span>Atividade física</span></div><div class="stat"><b>1</b><span>Alimentação</span></div></div><div class="panel" style="margin-top:14px"><h3>Fontes oficiais e científicas</h3>${sources.map(([name,desc,url,area])=>`<div class="listline"><div><strong>${E(name)}</strong><p>${E(desc)} · ${E(area)}</p></div><a class="btn compact" href="${url}" target="_blank" rel="noopener noreferrer">Site oficial ${I('arrow',14)}</a></div>`).join('')}</div>`;}
function docs(){const v=visit();return pageHeader('Documentos Clínicos','Modelos clean, com ícone oficial, farmácia e profissional identificados.')+`<div class="panel"><div class="field"><label>Atendimento para o documento</label><select id="doc-visit"><option value="">Selecione...</option>${data.visits.map(x=>`<option value="${x.id}" ${v?.id===x.id?'selected':''}>${E(patientFor(x)?.name||'Paciente')} · ${fmtDate(x.date)}</option>`).join('')}</select></div><div class="notice blue">Documentos desta fase são rascunhos demonstrativos. A declaração de comparecimento não valida presença real sem conferência.</div><div class="tilegrid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:15px">${[['clinical','Ficha clínica','Cadastro e avaliação'],['prescription','Receituário','Um documento para paciente e manipulação'],['attendance','Comparecimento','Data e horários efetivos'],['service','Serviço farmacêutico','Declaração do serviço executado'],['protocol','Protocolo complementar','Atividade física e alimentação educativa']].map(([doc,title,desc])=>`<button class="tile" data-doc="${doc}" style="min-height:130px"><span class="icon-bg">${I('files')}</span><strong>${title}</strong><span>${desc}</span></button>`).join('')}</div></div>`;}
function settings(){const s=data.settings;return pageHeader('Identidade documental','Os dados institucionais e profissionais serão reutilizados nos modelos demonstrativos.')+`<div class="panel"><form id="settings-form"><div class="form-grid">${field('professional','Profissional',s.professional)}${field('role','Atuação',s.role)}${field('crf','Registro CRF',s.crf)}${field('contact','Contato profissional',s.contact)}${field('workplace','Estabelecimento',s.workplace)}${field('address','Endereço institucional',s.address)}${field('businessPhone','Telefone do estabelecimento',s.businessPhone)}${field('cnpj','CNPJ (somente confirmado)',s.cnpj)}${field('professionalAddress','Endereço profissional',s.professionalAddress)}</div><div class="notice">O uso institucional e os documentos definitivos exigem validação de dados, autorização e requisitos aplicáveis. Não inserir dados reais de pacientes neste protótipo.</div><div class="form-actions"><button class="btn primary" type="submit">${I('check')} Salvar identidade</button><button class="btn danger" type="button" data-action="clear-demo">Limpar dados da demonstração</button></div></form></div>`;}
function pageContent(){switch(ui.page){case'patients':return patients();case'conversation':return conversation();case'editor':return editor();case'formulas':return formulas();case'prescriptions':return prescriptions();case'followup':return followup();case'simulator':return simulator();case'science':return science();case'docs':return docs();case'settings':return settings();default:return home();}}
function render(){document.getElementById('app').innerHTML=layout();}
function readForm(form){return Object.fromEntries(new FormData(form).entries());}
function trimForm(obj){for(const k of Object.keys(obj))if(typeof obj[k]==='string')obj[k]=obj[k].trim();return obj;}
function saveFormula(form){const v=visit();if(!v)return;const next=trimForm(readForm(form));if(Number(next.duration)<1||Number(next.duration)>3650){toast('A duração deve ser maior que zero.');return;}Object.assign(v,next);v.duration=Number(next.duration)||15;v.revisions.push({ savedAt:new Date().toISOString(), ingredients:JSON.parse(JSON.stringify(v.ingredients)), formulaName:v.formulaName, posology:v.posology });persist();toast('Formulação salva com versão registrada.');render();}
function preview(doc,chosen=visit()){const v=chosen,p=v&&patientFor(v);if(!v||!p){toast('Selecione primeiro um atendimento.');return;}if(doc==='service'&&(!data.settings.cnpj||!data.settings.businessPhone)){toast('Preencha CNPJ e telefone institucional confirmados antes deste modelo.');setPage('settings');return;}if(doc==='prescription'&&(!v.ingredients.length||!v.posology||!v.quantity)){toast('Complete substâncias, quantidade e posologia antes do receituário.');setPage('editor');return;}ui.doc=doc;document.getElementById('print-root').innerHTML=renderPaper(doc,v,p);window.print();}
function renderPaper(doc,v,p){const s=data.settings, names={clinical:'FICHA CLÍNICA / CADASTRO',prescription:'RECEITUÁRIO MAGISTRAL',attendance:'DECLARAÇÃO DE COMPARECIMENTO',service:'DECLARAÇÃO DE SERVIÇO FARMACÊUTICO',protocol:'PROTOCOLO COMPLEMENTAR'};const line=(label,value)=>`<div class="print-section"><span class="print-label">${label}:</span> ${E(value||'—')}</div>`;const header=`<div class="print-head"><img src="${IMG}" alt="Logo oficial LifeMag IA"/><div><strong>LifeMag IA</strong><small>Prescrição Magistral Inteligente</small><div class="print-institution"><b>${E(s.workplace)}</b><br>${E(s.address)}<br>${E(s.professional)} — ${E(s.role)} — ${E(s.crf)}</div></div></div>`;const common=line('Paciente',p.name)+line('Data do atendimento',fmtDate(v.date))+line('Telefone',p.phone);let body='';if(doc==='prescription'){body=common+line('Endereço do paciente',p.address)+`<table class="print-table"><thead><tr><th>Substância</th><th>Dose</th></tr></thead><tbody>${v.ingredients.map(i=>`<tr><td>${E(i.name)}</td><td>${E(i.dose)} ${E(i.unit||'mg')}</td></tr>`).join('')}</tbody></table>`+line('Apresentação',v.presentation)+line('Via de administração',v.route)+line('Quantidade para manipular',v.quantity)+line('Posologia',v.posology)+line('Horários',v.schedules)+line('Relação com refeições',v.meals)+line('Duração',v.duration+' dias')+line('Orientações',v.observations);}else if(doc==='clinical'){body=common+line('Nascimento',fmtDate(p.dob))+line('Endereço',p.address)+line('Peso (kg)',p.weight)+line('Altura (cm)',p.height)+line('Observações clínicas',p.notes);}else if(doc==='attendance'){body=common+line('Horário de entrada','_________')+line('Horário de saída','_________')+`<p>Declaramos, para fins de comprovação, que a pessoa identificada compareceu ao atendimento farmacêutico no período efetivamente confirmado.</p>`;}else if(doc==='service'){body=common+line('CNPJ',s.cnpj)+line('Telefone institucional',s.businessPhone)+line('Serviço efetivamente realizado','_____________________________________________')+line('Resultado/observações','_____________________________________________');}else{body=common+line('Formulação vinculada',v.formulaName)+line('Orientações educativas complementares',v.protocol||'Não informado')+`<p>Intensidade progressiva, iniciando leve e evoluindo gradualmente conforme condicionamento e tolerância, se aplicável.</p>`;}return `<article class="print-page">${header}<h1 class="print-h">${names[doc]}</h1><p class="print-note"><b>RASCUNHO DE TESTE — NÃO ASSINADO — NÃO VÁLIDO PARA USO CLÍNICO</b></p>${body}<div class="print-foot"><div class="print-sign"><b>${E(s.professional)}</b><br>${E(s.role)} — ${E(s.crf)}<br><small>Campo reservado à assinatura válida</small></div></div></article>`;}
function handleClick(event){const b=event.target.closest('[data-page],[data-action],[data-select-patient],[data-open-visit],[data-add-ingredient],[data-remove-ingredient],[data-print-visit],[data-complete],[data-doc]');if(!b)return;if(b.dataset.page){setPage(b.dataset.page);return;}if(b.dataset.selectPatient){ui.patientId=b.dataset.selectPatient;render();return;}if(b.dataset.openVisit){const v=data.visits.find(x=>x.id===b.dataset.openVisit);if(v){useVisit(v);setPage('editor');}return;}if(b.dataset.printVisit){const v=data.visits.find(x=>x.id===b.dataset.printVisit);if(v){useVisit(v);preview('prescription',v);}return;}if(b.dataset.doc){preview(b.dataset.doc);return;}if(b.dataset.removeIngredient){const v=visit();if(!v)return;v.ingredients=v.ingredients.filter(i=>i.id!==b.dataset.removeIngredient);persist();render();return;}if(b.dataset.complete){const v=data.visits.find(x=>x.id===b.dataset.complete);if(v){v.status=v.status==='finalizado'?'em acompanhamento':'finalizado';persist();render();}return;}
const a=b.dataset.action;if(a==='new-visit')startVisit(ui.patientId||(data.patients.length===1?data.patients[0]?.id:null));if(a==='clear-patient'){ui.patientId=null;render();}if(a==='add-ingredient'){const v=visit();if(v){v.ingredients.push({id:uid('ing'),name:'',dose:'',unit:'mg',role:'',target:'',evidence:''});persist();render();}}if(a==='save-protocol'){const v=visit();if(v){v.protocol=document.getElementById('protocol-text')?.value||'';persist();toast('Protocolo educativo salvo.');}}if(a==='test-sound'){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error();const c=new AC(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.10,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25);o.onended=()=>c.close();toast('Som de demonstração reproduzido.');}catch(e){toast('Som indisponível neste navegador.');}}if(a==='clear-demo'){if(confirm('Apagar os dados locais desta demonstração?')){localStorage.removeItem(STORAGE_KEY);Object.assign(data,initialState());ui.patientId=null;ui.visitId=null;setPage('home');toast('Demonstração limpa.');}}}
function handleSubmit(event){const f=event.target;if(!f.matches('#patient-form,#settings-form,#chat-form,#formula-form'))return;event.preventDefault();if(f.id==='patient-form'){const val=trimForm(readForm(f));if(!val.name||!val.phone){toast('Nome e telefone são obrigatórios.');return;}if(!ui.patientId){const id=uid('pac');data.patients.push({id,...val});ui.patientId=id;}else{Object.assign(patient(),val);}persist();render();toast('Cadastro salvo (somente neste navegador).');}else if(f.id==='settings-form'){Object.assign(data.settings,trimForm(readForm(f)));persist();toast('Identificação documental salva.');}else if(f.id==='chat-form'){const val=trimForm(readForm(f));if(!val.message)return;visit().chat.push({id:uid('msg'),text:val.message,createdAt:new Date().toISOString()});persist();render();toast('Observação registrada; IA ainda não conectada.');}else if(f.id==='formula-form'){saveFormula(f);}}
function handleChange(e){const control=e.target;if(control.dataset.ingField){const outer=control.closest('[data-ingredient-id]');const v=visit();const x=v?.ingredients.find(i=>i.id===outer.dataset.ingredientId);if(x){x[control.dataset.ingField]=control.value;persist();}return;}if(control.closest?.('#formula-form') && control.name){const v=visit();if(v){v[control.name]=control.value;persist();}return;}if(control.id==='sim-visit'){const v=data.visits.find(x=>x.id===control.value);if(v){useVisit(v);render();}}if(control.id==='doc-visit'){const v=data.visits.find(x=>x.id===control.value);if(v){useVisit(v);render();}}}
document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('change',handleChange);document.addEventListener('input',e=>{if(e.target.id==='patient-filter'){ui.search=e.target.value;const root=document.getElementById('patient-results');if(root)root.innerHTML=data.patients.filter(x=>(x.name+' '+x.phone).toLowerCase().includes(ui.search.toLowerCase())).map(patientCard).join('')||empty('Nenhum resultado','Revise a busca.');}});
// Uma demonstração contém apenas dados explicitamente criados pelo usuário; não há pacientes reais embutidos.
render();

</script>
</body>
</html>
